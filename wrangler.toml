name = "sayme"
main = "entry-worker.ts"
compatibility_date = "2026-08-28"
# nodejs_compat enabled by default for dates >= 2026-08-04

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[triggers]
crons = [
  "*/5 * * * *",   # Process send queue every 5 mins
  "*/15 * * * *",  # Check for replies every 15 mins
]
